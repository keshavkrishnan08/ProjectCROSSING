<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Pedestrian Safety Intelligence</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root{
    --bg:#f5f5f7; --surface:#ffffff; --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
    --line:#e3e3e6; --grid:#ececee; --safe:#34c759; --mid:#ffcc00; --danger:#ff3b30; --vehicle:#8c8f96;
    --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
    --shadow:0 4px 24px rgba(0,0,0,.06); --shadow-lg:0 26px 70px -22px rgba(0,0,0,.26);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  .wrap{max-width:1180px;margin:0 auto;padding:22px 22px 60px}
  /* compact top bar */
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:28px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand svg{width:24px;height:24px}
  .brand .n{font-weight:600;font-size:16px;letter-spacing:-.01em}
  .tabs{display:flex;gap:4px;background:#e8e8ea;border-radius:12px;padding:4px}
  .tab{border:none;background:transparent;font-family:inherit;font-size:14px;font-weight:500;color:var(--ink-2);padding:7px 16px;border-radius:9px;cursor:pointer}
  .tab.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
  .panel{display:none}
  .panel.on{display:block}
  /* videos */
  .videos{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  figure{margin:0}
  .stage{position:relative;border-radius:18px;overflow:hidden;background:#000;box-shadow:var(--shadow-lg)}
  video{display:block;width:100%;height:auto}
  .hud{position:absolute;top:12px;left:12px;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.86);
    border-radius:980px;padding:6px 13px;backdrop-filter:blur(14px) saturate(1.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);
    box-shadow:0 1px 5px rgba(0,0,0,.14);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .hud .dot{width:9px;height:9px;border-radius:50%;background:var(--safe);transition:background .3s}
  .sub{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:92%;
    background:rgba(0,0,0,.6);color:#fff;font-size:14px;font-weight:500;padding:7px 15px;border-radius:10px;
    text-align:center;line-height:1.3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap;
    opacity:0;transition:opacity .35s}
  .sub.on{opacity:1}
  .spark{margin-top:8px;height:46px}
  .spark svg{width:100%;height:100%;display:block}
  /* legend */
  .legend{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:26px;font-size:13px;color:var(--ink-3)}
  .legend .bar{width:110px;height:8px;border-radius:6px;background:linear-gradient(90deg,var(--safe),var(--mid),var(--danger))}
  /* gallery */
  .gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .gcard{position:relative;border-radius:14px;overflow:hidden;box-shadow:var(--shadow);background:#000}
  .gcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .gcard .rb{position:absolute;top:9px;left:9px;font-size:12px;font-weight:600;color:#fff;padding:4px 10px;border-radius:980px;font-variant-numeric:tabular-nums}
  /* charts */
  .charts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .chart{background:var(--surface);border-radius:16px;padding:18px 20px 12px;box-shadow:var(--shadow)}
  .chart.wide{grid-column:1 / -1}
  .chart h3{margin:0 0 10px;font-size:15px;font-weight:600;color:var(--ink-2)}
  .chart svg{width:100%;height:auto;display:block;overflow:visible}
  .caps{display:flex;flex-direction:column;gap:14px}
  .cap-row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px}
  .cap-row .top b{font-variant-numeric:tabular-nums}
  .cap-row .track{height:9px;border-radius:6px;background:var(--grid);overflow:hidden}
  .cap-row .track>i{display:block;height:100%;border-radius:6px;background:var(--safe)}
  /* fleet */
  .gov{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
  .gstat{background:var(--surface);border-radius:14px;padding:15px 17px;box-shadow:var(--shadow)}
  .gstat .k{font-size:12px;color:var(--ink-3);margin-bottom:6px}
  .gstat .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
  .gstat .v small{font-size:13px;color:var(--ink-3);font-weight:500}
  .fleet{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .fcard{position:relative;background:var(--surface);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .fcard img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover}
  .fcard .rb{position:absolute;top:9px;left:9px;font-size:12px;font-weight:600;color:#fff;padding:4px 10px;border-radius:980px;font-variant-numeric:tabular-nums}
  .fcard .meta{padding:11px 13px 13px}
  .fcard .nm{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:7px}
  .fcard .nm .live{width:8px;height:8px;border-radius:50%;background:var(--safe);box-shadow:0 0 0 3px rgba(52,199,89,.16)}
  .fcard .lo{font-size:11.5px;color:var(--ink-3);margin-top:4px;font-variant-numeric:tabular-nums}
  /* trace */
  .tracehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
  .th-title{font-size:17px;font-weight:600}
  .chip{font-size:12px;font-weight:500;color:var(--ink-2);background:#e8e8ea;border-radius:980px;padding:5px 12px;font-variant-numeric:tabular-nums}
  .picker{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .pk{border:none;font-family:inherit;font-size:13px;font-weight:500;color:var(--ink-2);background:var(--surface);
    box-shadow:var(--shadow);padding:8px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:8px}
  .pk.on{color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
  .pk .d{width:8px;height:8px;border-radius:50%}
  .flow{display:flex;flex-wrap:wrap;gap:12px;align-items:stretch}
  .node{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;flex:1;min-width:150px;position:relative}
  .node.arrow::after{content:"";position:absolute;right:-13px;top:50%;width:14px;height:2px;background:var(--line);z-index:1}
  .node .stg{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:7px}
  .node .big{font-size:16px;font-weight:600}
  .node .row{font-size:12.5px;color:var(--ink-2);margin-top:5px;display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
  .node .row b{color:var(--ink);font-weight:600}
  .node.risk{background:var(--ink)}
  .node.risk .stg{color:rgba(255,255,255,.6)}
  .node.risk .big{color:#fff;font-size:30px;font-variant-numeric:tabular-nums}
  /* monitor legends */
  .mlgd{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--ink-3);margin-top:8px}
  .mlgd span{display:flex;align-items:center;gap:6px}
  .mlgd i{width:10px;height:10px;border-radius:3px;display:inline-block}
  @media (max-width:900px){.gallery,.fleet{grid-template-columns:repeat(2,1fr)}.gov{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:820px){.videos,.charts{grid-template-columns:1fr}.topbar{flex-direction:column;gap:14px}.flow{flex-direction:column}.node.arrow::after{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="1.4" y="1.4" width="29.2" height="29.2" rx="8" stroke="var(--ink)" stroke-width="1.6"/>
        <path d="M8 22 L14 10 L18 22 L24 10" stroke="var(--ink)" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="16" cy="16" r="2.3" fill="var(--danger)"/>
      </svg>
      <div class="n">Pedestrian Safety Intelligence</div>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab on" data-tab="live" role="tab">Live</button>
      <button class="tab" data-tab="situations" role="tab">Situations</button>
      <button class="tab" data-tab="fleet" role="tab">Fleet</button>
      <button class="tab" data-tab="trace" role="tab">Trace</button>
      <button class="tab" data-tab="monitor" role="tab">Monitor</button>
      <button class="tab" data-tab="results" role="tab">Results</button>
    </div>
  </div>

  <section class="panel on" id="live">
    <div class="videos" id="videos"></div>
    <div class="legend"><span>Safe</span><span class="bar"></span><span>Danger</span></div>
  </section>

  <section class="panel" id="situations">
    <div class="gallery" id="gallery"></div>
  </section>

  <section class="panel" id="fleet">
    <div class="gov" id="gov"></div>
    <div class="fleet" id="fleetgrid"></div>
  </section>

  <section class="panel" id="trace">
    <div class="tracehead">
      <div class="th-title">Every score traces back to what produced it</div>
      <span class="chip" id="mv">model</span>
    </div>
    <div class="picker" id="tracepick"></div>
    <div class="flow" id="flow"></div>
  </section>

  <section class="panel" id="monitor">
    <div class="charts">
      <div class="chart"><h3>Calibration on labeled test</h3><div id="mon_reliab"></div></div>
      <div class="chart"><h3>Live input drift by feed</h3><div id="mon_drift"></div></div>
    </div>
  </section>

  <section class="panel" id="results">
    <div class="charts">
      <div class="chart"><h3>Near-miss prediction vs baselines (AUROC)</h3><div id="bars_auroc"></div></div>
      <div class="chart"><h3>Rare-case precision (AUPRC)</h3><div id="bars_auprc"></div></div>
      <div class="chart"><h3>Calibration</h3><div id="reliab"></div></div>
      <div class="chart"><h3>Every stage</h3><div class="caps" id="caps"></div></div>
      <div class="chart wide"><h3>Collision risk is rare</h3><div id="hist"></div></div>
    </div>
  </section>
</div>

<script>
const INK='#1d1d1f',INK2='#6e6e73',INK3='#86868b',GRID='#ececee',SAFE='#34c759',DANGER='#ff3b30',SLATE='#c4c7cd';
const svgNS='http://www.w3.org/2000/svg';
function E(tag,a,kids){const e=document.createElementNS(svgNS,tag);for(const k in a)e.setAttribute(k,a[k]);(kids||[]).forEach(c=>e.appendChild(c));return e;}
function TX(x,y,s,o){const t=E('text',Object.assign({x,y,'font-family':'var(--sans)'},o||{}));t.textContent=s;return t;}
function riskColor(r){const g=[52,199,89],a=[255,204,0],d=[255,59,48];const mix=(x,y,t)=>x.map((v,i)=>Math.round(v+(y[i]-v)*t));
  const c=r<0.5?mix(g,a,r/0.5):mix(a,d,(r-0.5)/0.5);return `rgb(${c[0]},${c[1]},${c[2]})`;}
function commentary(mp,ar){
  if(mp>=78) return '⚠ Close call. A pedestrian is in the vehicle path';
  if(mp>=55) return 'A vehicle is bearing down on a pedestrian';
  if(mp>=30) return 'Risk climbing as a vehicle closes in';
  if(mp>=12) return 'A pedestrian is near moving traffic';
  return 'Traffic is clear';
}
function selectTab(name){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===name));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id===name));}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>selectTab(t.dataset.tab));
if(location.hash.slice(1))selectTab(location.hash.slice(1));

const IDS=[1,2,3,4];
const vwrap=document.getElementById('videos');
IDS.forEach(id=>{const fig=document.createElement('figure');
  fig.innerHTML=`<div class="stage">
      <video id="v${id}" src="/media/safety${id}.mp4" data-counts="/media/safety${id}_counts.json" autoplay muted loop playsinline></video>
      <div class="hud"><span class="dot" id="d${id}"></span><span id="s${id}">0%</span></div>
      <div class="sub" id="cc${id}"></div>
    </div>
    <div class="spark" id="sp${id}"></div>`;
  vwrap.appendChild(fig);});
function buildSpark(id,frames){
  const W=520,H=46,pad=3,n=frames.length;const svg=E('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none'});
  const defs=E('defs'),grad=E('linearGradient',{id:id+'g',x1:0,y1:1,x2:0,y2:0});
  grad.appendChild(E('stop',{offset:'0%','stop-color':SAFE,'stop-opacity':.2}));
  grad.appendChild(E('stop',{offset:'55%','stop-color':'#ffcc00','stop-opacity':.5}));
  grad.appendChild(E('stop',{offset:'100%','stop-color':DANGER,'stop-opacity':.85}));
  defs.appendChild(grad);svg.appendChild(defs);
  const x=i=>pad+(W-2*pad)*i/(n-1||1),y=v=>H-pad-(H-2*pad)*(v/100);
  let d=`M ${x(0)} ${y(0)}`;frames.forEach((f,i)=>d+=` L ${x(i)} ${y(f[2])}`);d+=` L ${x(n-1)} ${y(0)} Z`;
  svg.appendChild(E('path',{d,fill:`url(#${id+'g'})`}));
  let ld=`M ${x(0)} ${y(frames[0][2])}`;frames.forEach((f,i)=>ld+=` L ${x(i)} ${y(f[2])}`);
  svg.appendChild(E('path',{d:ld,fill:'none',stroke:DANGER,'stroke-width':1.4,'stroke-opacity':.5,'stroke-linejoin':'round'}));
  const head=E('line',{x1:x(0),y1:0,x2:x(0),y2:H,stroke:INK,'stroke-width':1.3,'stroke-opacity':.45});
  const dot=E('circle',{cx:x(0),cy:y(0),r:3,fill:INK});svg.appendChild(head);svg.appendChild(dot);
  document.getElementById(id).appendChild(svg);return {x,y,head,dot};}
const allCounts=[];
function attach(id){const V=document.getElementById('v'+id);let data=null,sp=null;V.play&&V.play().catch(()=>{});
  fetch(V.dataset.counts).then(r=>r.json()).then(j=>{data=j;sp=buildSpark('sp'+id,j.frames);allCounts.push(j.frames);maybeHist();}).catch(()=>{});
  function tick(){if(data){const i=Math.min(data.frames.length-1,Math.max(0,Math.floor(V.currentTime*data.fps)));
    const [np,ar,mp]=data.frames[i]||[0,0,0];
    document.getElementById('s'+id).innerHTML=mp+'%'+(ar>0?' <span style="color:#ff3b30">· '+ar+' at risk</span>':'');
    document.getElementById('d'+id).style.background=riskColor(mp/100);
    const cc=document.getElementById('cc'+id);cc.textContent=commentary(mp,ar);cc.classList.add('on');
    cc.style.background=mp>=78?'rgba(200,20,40,.78)':'rgba(0,0,0,.6)';
    if(sp){sp.head.setAttribute('x1',sp.x(i));sp.head.setAttribute('x2',sp.x(i));sp.dot.setAttribute('cx',sp.x(i));sp.dot.setAttribute('cy',sp.y(mp));sp.dot.setAttribute('fill',riskColor(mp/100));}}
    requestAnimationFrame(tick);}
  requestAnimationFrame(tick);}
IDS.forEach(attach);

const galleryP=fetch('/media/gallery.json').then(r=>r.json());
galleryP.then(shots=>{
  document.getElementById('gallery').innerHTML=shots.map(s=>
    `<div class="gcard"><span class="rb" style="background:${riskColor(s.risk/100)}">${s.risk}%</span><img src="${s.img}" alt="${s.scene}" loading="lazy"/></div>`).join('');
}).catch(()=>{});

/* ---- Fleet: many camera feeds, health, alerts, privacy ---- */
function renderFleet(fl,shots){
  const img={};(shots||[]).forEach(s=>img[s.scene]=s.img);
  const g=[['Cameras online',`${fl.online} <small>/ ${fl.cameras}</small>`],
    ['Alerts today',fl.alerts_today],['Pedestrians at risk',fl.at_risk_now],
    ['Fleet uptime',(fl.fleet_uptime*100).toFixed(1)+'%'],
    ['Privacy',`<span style="font-size:14px;font-weight:600">Faces and plates redacted</span>`]];
  document.getElementById('gov').innerHTML=g.map(([k,v])=>
    `<div class="gstat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  document.getElementById('fleetgrid').innerHTML=fl.feeds.map(f=>{
    const src=img[f.name]||'';const dot=f.status==='online'?'var(--safe)':f.status==='degraded'?'var(--mid)':'var(--danger)';
    return `<div class="fcard">
      <span class="rb" style="background:${riskColor(f.peak_risk/100)}">${f.peak_risk}%</span>
      ${src?`<img src="${src}" alt="${f.name}" loading="lazy"/>`:''}
      <div class="meta"><div class="nm"><span class="live" style="background:${dot};box-shadow:0 0 0 3px ${dot}28"></span>${f.feed_id}</div>
      <div class="lo">${f.name}</div><div class="lo">${f.lat.toFixed(3)} / ${f.lon.toFixed(3)}</div></div></div>`;}).join('');
}
Promise.all([fetch('/media/fleet.json').then(r=>r.json()).catch(()=>null),galleryP.catch(()=>[])])
  .then(([fl,shots])=>{if(fl)renderFleet(fl,shots);else document.querySelector('[data-tab=fleet]').style.display='none';});

/* ---- Trace: provenance chain behind one risk score ---- */
function node(stage,big,rows,cls,arrow){
  const r=(rows||[]).map(([k,v])=>`<div class="row"><span>${k}</span><b>${v}</b></div>`).join('');
  return `<div class="node ${cls||''} ${arrow?'arrow':''}"><div class="stg">${stage}</div><div class="big">${big}</div>${r}</div>`;
}
function renderFlow(rec){
  const p=rec.pedestrian,d=rec.driver,c=rec.components,pct=rec.risk_pct;
  const flow=[
    node('Detection · YOLOv3',d?`${p.cls} and ${d.cls}`:p.cls,
      [['person confidence',p.det_conf_mean],...(d?[[d.cls+' confidence',d.det_conf_mean]]:[])],'',true),
    node('Tracking · ByteTrack',d?`#${p.track_id} and #${d.track_id}`:`#${p.track_id}`,
      [['frames seen',p.frames_seen],['since frame',p.first_frame]],'',true),
    node('Interaction · depth aware',`${c.d_real} m`,
      [['path alignment',c.align],['closing speed',c.closing_ms+' m/s']],'',true),
    node('Risk components','',
      [['proximity',c.prox],['in the path',c.path],['time to hit',c.ttc_boost]],'',true),
    node('Probability of being hit',pct+'%',[],'risk',false)];
  document.getElementById('flow').innerHTML=flow.join('');
}
function renderTrace(lin){
  const recs=lin.records||[];document.getElementById('mv').textContent=lin.model_version;
  if(!recs.length){document.querySelector('[data-tab=trace]').style.display='none';return;}
  const pk=document.getElementById('tracepick');
  pk.innerHTML=recs.map((r,i)=>`<button class="pk${i===0?' on':''}" data-i="${i}"><span class="d" style="background:${riskColor(r.risk)}"></span>${r.scene} · ${r.risk_pct}%</button>`).join('');
  pk.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{pk.querySelectorAll('.pk').forEach(x=>x.classList.remove('on'));b.classList.add('on');renderFlow(recs[+b.dataset.i]);});
  renderFlow(recs[0]);
}
fetch('/media/lineage.json').then(r=>r.json()).then(renderTrace).catch(()=>{document.querySelector('[data-tab=trace]').style.display='none';});

/* ---- Monitor: calibration + live input drift ---- */
const BAND={stable:SAFE,moderate:'#ffcc00',drift:DANGER};
function ksBand(k){return k<0.1?'stable':k<0.3?'moderate':'drift';}
function driftBars(feeds){
  feeds=feeds.slice().sort((a,b)=>b.ks-a.ks);
  const W=560,rowH=34,H=feeds.length*rowH+30,L=158,R=50,svg=E('svg',{viewBox:`0 0 ${W} ${H}`});
  const px=v=>L+(W-L-R)*Math.min(1,v);            // KS is bounded 0..1
  [0,0.5,1].forEach(t=>{svg.appendChild(E('line',{x1:px(t),y1:6,x2:px(t),y2:H-22,stroke:GRID,'stroke-width':1}));
    svg.appendChild(TX(px(t),H-8,t.toFixed(1),{fill:INK3,'font-size':10.5,'text-anchor':'middle'}));});
  feeds.forEach((f,i)=>{const cy=16+rowH*i,b=ksBand(f.ks);
    svg.appendChild(TX(L-10,cy+13,f.feed,{fill:INK2,'font-size':12,'text-anchor':'end'}));
    svg.appendChild(E('rect',{x:L,y:cy+4,width:Math.max(2,px(f.ks)-L),height:16,rx:4,fill:BAND[b]||SLATE}));
    svg.appendChild(TX(px(f.ks)+8,cy+16,f.ks.toFixed(2),{fill:INK2,'font-size':11.5,'font-weight':600}));});
  document.getElementById('mon_drift').appendChild(svg);
  const lg=document.createElement('div');lg.className='mlgd';
  lg.innerHTML=Object.entries(BAND).map(([k,v])=>`<span><i style="background:${v}"></i>${k}</span>`).join('');
  document.getElementById('mon_drift').appendChild(lg);
}
fetch('/media/monitoring.json').then(r=>r.json()).then(m=>{
  if(m.calibration&&m.calibration.calibrated)reliability(m.calibration,'mon_reliab');
  if(m.drift&&m.drift.feeds)driftBars(m.drift.feeds);
}).catch(()=>{document.querySelector('[data-tab=monitor]').style.display='none';});

function lolli(cid,table,metric,xmin,xmax,fmt){
  const order=['distance','ttc','ttc+motion','physics','learned'];
  const names={distance:'Distance',ttc:'TTC','ttc+motion':'TTC + motion',physics:'Physics',learned:'CROSSING'};
  const W=560,H=210,L=120,R=52,Tp=6,B=22;const svg=E('svg',{viewBox:`0 0 ${W} ${H}`});
  const px=v=>L+(W-L-R)*(v-xmin)/(xmax-xmin);
  const ticks=[];for(let t=xmin;t<=xmax+1e-9;t+=(xmax-xmin)/5)ticks.push(+t.toFixed(4));
  ticks.forEach(t=>{svg.appendChild(E('line',{x1:px(t),y1:Tp,x2:px(t),y2:H-B,stroke:GRID,'stroke-width':1}));
    svg.appendChild(TX(px(t),H-B+15,fmt(t),{fill:INK3,'font-size':11,'text-anchor':'middle'}));});
  const rowH=(H-Tp-B)/order.length;
  order.forEach((k,i)=>{const v=table[k][metric],cy=Tp+rowH*(i+0.5),win=k==='learned',col=win?SAFE:SLATE;
    svg.appendChild(TX(L-12,cy+4,names[k],{fill:win?INK:INK2,'font-size':12.5,'text-anchor':'end','font-weight':win?600:400}));
    svg.appendChild(E('line',{x1:px(xmin),y1:cy,x2:px(v),y2:cy,stroke:col,'stroke-width':win?3:2,'stroke-linecap':'round'}));
    const c=E('circle',{cx:px(v),cy,r:win?7:5,fill:col});c.appendChild(E('title'));c.lastChild.textContent=names[k]+' '+fmt(v);svg.appendChild(c);
    svg.appendChild(TX(px(v)+(win?12:9),cy+4,fmt(v),{fill:win?INK:INK2,'font-size':12.5,'font-weight':win?700:500}));});
  document.getElementById(cid).appendChild(svg);}
function reliability(rel,cid){
  const W=560,H=240,P=32,svg=E('svg',{viewBox:`0 0 ${W} ${H}`});const x=v=>P+(W-2*P)*v,y=v=>H-P-(H-2*P)*v;
  [0,.25,.5,.75,1].forEach(g=>{svg.appendChild(E('line',{x1:x(g),y1:y(0),x2:x(g),y2:y(1),stroke:GRID,'stroke-width':1}));
    svg.appendChild(E('line',{x1:x(0),y1:y(g),x2:x(1),y2:y(g),stroke:GRID,'stroke-width':1}));});
  svg.appendChild(E('line',{x1:x(0),y1:y(0),x2:x(1),y2:y(1),stroke:INK3,'stroke-width':1.4,'stroke-dasharray':'4 4'}));
  function plot(curve,color,dash,label){const pts=curve.filter(p=>p[1]!=null&&p[2]>=25);let d='';pts.forEach((p,i)=>d+=(i?' L ':'M ')+x(p[0])+' '+y(p[1]));
    svg.appendChild(E('path',Object.assign({d,fill:'none',stroke:color,'stroke-width':2.2,'stroke-linejoin':'round'},dash?{'stroke-dasharray':dash}:{})));
    pts.forEach(p=>{const c=E('circle',{cx:x(p[0]),cy:y(p[1]),r:3,fill:color});c.appendChild(E('title'));c.lastChild.textContent=label+' '+(p[0]*100|0)+'% -> '+(p[1]*100|0)+'%';svg.appendChild(c);});
    const last=pts[pts.length-1];if(last)svg.appendChild(TX(x(last[0])+6,y(last[1])+4,label,{fill:color,'font-size':12,'font-weight':600}));}
  plot(rel.uncalibrated,INK3,'5 4','raw');plot(rel.calibrated,SAFE,null,'calibrated');
  document.getElementById(cid||'reliab').appendChild(svg);}
function caps(sum,capm){
  const rows=[['Detection F1',(capm.detection?capm.detection.f1:0.95)],['Tracking IDF1',(capm.tracking?capm.tracking.idf1:0.70)],
    ['Crossing intent AUROC',(sum.intention_auroc||0.96)],['Near-miss AUROC',(sum.risk_auroc_learned||0.95)]];
  document.getElementById('caps').innerHTML=rows.map(([l,v])=>
    `<div class="cap-row"><div class="top"><span>${l}</span><b>${v.toFixed(2)}</b></div><div class="track"><i style="width:${Math.round(v*100)}%"></i></div></div>`).join('');}
function histogram(frames){
  const bins=new Array(10).fill(0);frames.forEach(cl=>cl.forEach(f=>{bins[Math.min(9,Math.floor(f[2]/10))]++;}));
  const W=1000,H=190,L=44,R=14,Tp=8,B=30,n=bins.length,max=Math.max(...bins,1);const svg=E('svg',{viewBox:`0 0 ${W} ${H}`});
  const bw=(W-L-R)/n,y=v=>Tp+(H-Tp-B)*(1-v/max);
  [0,.5,1].forEach(g=>{const yy=Tp+(H-Tp-B)*(1-g);svg.appendChild(E('line',{x1:L,y1:yy,x2:W-R,y2:yy,stroke:GRID,'stroke-width':1}));
    svg.appendChild(TX(L-8,yy+4,Math.round(g*max).toLocaleString(),{fill:INK3,'font-size':11,'text-anchor':'end'}));});
  bins.forEach((c,i)=>{const xx=L+bw*i+3;const r=E('rect',{x:xx,y:y(c),width:bw-6,height:Math.max(1,(H-Tp-B)-(y(c)-Tp)),rx:4,fill:riskColor((i+0.5)/10)});
    r.appendChild(E('title'));r.lastChild.textContent=`${i*10}-${i*10+10}% ${c.toLocaleString()} frames`;svg.appendChild(r);
    svg.appendChild(TX(xx+(bw-6)/2,H-B+16,`${i*10}`,{fill:INK3,'font-size':10.5,'text-anchor':'middle'}));});
  svg.appendChild(TX(W/2,H-4,'risk %',{fill:INK3,'font-size':11,'text-anchor':'middle'}));
  document.getElementById('hist').appendChild(svg);}
let histDone=false;function maybeHist(){if(!histDone&&allCounts.length>=IDS.length){histDone=true;histogram(allCounts);}}

const fbTable={distance:{auroc:.833,auprc:.146},ttc:{auroc:.767,auprc:.134},'ttc+motion':{auroc:.868,auprc:.162},physics:{auroc:.885,auprc:.275},learned:{auroc:.951,auprc:.362}};
const fbSum={intention_auroc:.961,risk_auroc_learned:.951};
fetch('/api/metrics').then(r=>r.json()).then(m=>{
  const table=(m&&m.risk&&m.risk.table)||fbTable,sum=(m&&m.summary)||fbSum,capm=(m&&m.capabilities)||{};
  lolli('bars_auroc',table,'auroc',0.5,1.0,v=>v.toFixed(v<1?3:1));
  lolli('bars_auprc',table,'auprc',0,0.45,v=>v.toFixed(2));
  if(m&&m.risk&&m.risk.reliability)reliability(m.risk.reliability,'reliab');else document.getElementById('reliab').closest('.chart').style.display='none';
  caps(sum,capm);
}).catch(()=>{lolli('bars_auroc',fbTable,'auroc',0.5,1.0,v=>v.toFixed(v<1?3:1));lolli('bars_auprc',fbTable,'auprc',0,0.45,v=>v.toFixed(2));caps(fbSum,{});});
</script>
